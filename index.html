<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Friendship Day Swiggy ✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #05020a;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* PINK DIGITAL RAIN CANVAS */
    #pinkRainCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* CONTAINER STYLING */
    .container {
      position: relative;
      z-index: 10;
      width: 95%;
      max-width: 950px;
      text-align: center;
      background: rgba(18, 5, 25, 0.88);
      backdrop-filter: blur(14px);
      padding: 30px 15px;
      border-radius: 24px;
      border: 1px solid rgba(244, 114, 182, 0.3);
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.25);
      margin: 20px 0;
    }

    /* PAGE 1: FRONT QUESTION SCREEN */
    #page1 h1 {
      font-size: 2.8rem;
      color: #f472b6;
      text-shadow: 0 0 15px rgba(244, 114, 182, 0.8), 0 0 30px rgba(236, 72, 153, 0.4);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    #page1 p.sub-text {
      font-size: 1.4rem;
      color: #fbcfe8;
      text-shadow: 0 0 8px rgba(251, 207, 232, 0.5);
      margin-bottom: 70px;
    }

    /* BUTTON ZONE AROUND YES */
    .button-zone {
      position: relative;
      width: 100%;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .btn {
      padding: 14px 40px;
      font-size: 1.25rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
    }

    /* FIXED YES BUTTON AT CENTER */
    #yesBtn {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: white;
      z-index: 5;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #yesBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.8);
    }

    /* CONSTANTLY MOVING UNTOUCHABLE NO BUTTON */
    #noBtn {
      position: absolute;
      background: #334155;
      color: #94a3b8;
      z-index: 10;
      transition: all 0.15s linear;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: auto;
    }

    /* PAGE 2 LAYOUT */
    #page2 {
      display: none;
    }

    .quote-box {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid #f472b6;
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 15px;
      color: #fbcfe8;
      font-style: italic;
      font-size: 1rem;
      line-height: 1.4;
    }

    /* CIRCULAR CONTAINER AROUND THE WISH FOR 2 PHOTOS */
    .circle-wrapper {
      position: relative;
      width: 580px;
      height: 380px;
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CENTER WISH TEXT */
    .center-wish {
      width: 250px;
      font-size: 2.2rem;
      color: #f472b6;
      text-shadow: 0 0 20px rgba(244, 114, 182, 0.9), 0 0 35px rgba(236, 72, 153, 0.6);
      z-index: 2;
      line-height: 1.25;
    }

    /* PHOTO SLOTS POSITIONED FOR 2 PHOTOS (LEFT & RIGHT) */
    .photo-slot {
      position: absolute;
      width: 140px;
      height: 140px;
      background: rgba(30, 20, 40, 0.9);
      border-radius: 50%;
      padding: 8px;
      border: 2px solid rgba(244, 114, 182, 0.4);
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    /* 2 Circular Positions */
    .slot-0 { top: 50%; left: 20px; transform: translateY(-50%); }
    .slot-1 { top: 50%; right: 20px; transform: translateY(-50%); }

    /* PLUS ICON STYLING */
    .plus-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(244, 114, 182, 0.15);
      border: 2px dashed #f472b6;
      color: #f472b6;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .plus-btn:hover {
      transform: scale(1.15);
      background: rgba(244, 114, 182, 0.35);
      box-shadow: 0 0 20px rgba(244, 114, 182, 0.6);
    }

    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .photo-slot img:hover {
      transform: scale(1.08);
    }

    input[type="file"] {
      display: none;
    }

    /* FULLSCREEN IMAGE PREVIEW LIGHTBOX */
    #lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 2, 10, 0.9);
      backdrop-filter: blur(12px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #lightbox img {
      max-width: 85%;
      max-height: 80vh;
      border-radius: 16px;
      border: 2px solid #f472b6;
      box-shadow: 0 0 40px rgba(236, 72, 153, 0.5);
    }

    .close-lightbox {
      position: absolute;
      top: 25px;
      right: 30px;
      font-size: 2.5rem;
      color: #f472b6;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
    }

    @media (max-width: 620px) {
      .circle-wrapper {
        width: 340px;
        height: 250px;
      }
      .center-wish {
        width: 140px;
        font-size: 1.3rem;
      }
      .photo-slot {
        width: 85px;
        height: 85px;
      }
      .slot-0 { left: -5px; }
      .slot-1 { right: -5px; }
      .plus-btn {
        width: 38px;
        height: 38px;
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <!-- PINK DIGITAL RAIN CANVAS -->
  <canvas id="pinkRainCanvas"></canvas>

  <div class="container">
    <!-- PAGE 1 -->
    <div id="page1">
      <h1>Happy Friendship Day</h1>
      <p class="sub-text">Will you be my friend forever?</p>

      <div class="button-zone" id="btnZone">
        <button class="btn" id="yesBtn" onclick="goToPage2()">YES! ❤️</button>
        <button class="btn" id="noBtn">NO 😜</button>
      </div>
    </div>

    <!-- PAGE 2 -->
    <div id="page2">
      <div class="quote-box">
        "Friendship is not about who you've known the longest... It's about who came into your life, said 'I'm here for you,' and proved it." ✨
      </div>

      <!-- 2 PHOTOS CIRCLE WRAPPER AROUND WISH -->
      <div class="circle-wrapper">
        <div class="center-wish">
          Happy Friendship Day, Swiggy! 💖
        </div>

        <div class="photo-slot slot-0" id="slot-0">
          <div class="plus-btn" onclick="triggerUpload(0)">+</div>
          <input type="file" id="input-0" accept="image/*" onchange="uploadSinglePhoto(event, 0)" />
        </div>

        <div class="photo-slot slot-1" id="slot-1">
          <div class="plus-btn" onclick="triggerUpload(1)">+</div>
          <input type="file" id="input-1" accept="image/*" onchange="uploadSinglePhoto(event, 1)" />
        </div>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX MODAL FOR FULLSCREEN IMAGE VIEW -->
  <div id="lightbox" onclick="closeLightbox()">
    <span class="close-lightbox">&times;</span>
    <img id="lightboxImg" src="" alt="Full Preview" />
  </div>

  <script>
    /* 1. PINK RAIN MATRIX ANIMATION */
    const canvas = document.getElementById('pinkRainCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const pinkChars = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ💕✨🌸💖';
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function drawPinkRain() {
      ctx.fillStyle = 'rgba(5, 2, 10, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f472b6';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = pinkChars.charAt(Math.floor(Math.random() * pinkChars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawPinkRain, 33);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    /* 2. CONTINUOUSLY MOVING & UNTOUCHABLE NO BUTTON LOGIC */
    const noBtn = document.getElementById('noBtn');
    const btnZone = document.getElementById('btnZone');

    let posX = 100;
    let posY = 50;
    let velX = 2.5;
    let velY = 2;

    function moveNoBtnConstantly() {
      const zoneWidth = btnZone.clientWidth - noBtn.clientWidth;
      const zoneHeight = btnZone.clientHeight - noBtn.clientHeight;

      posX += velX;
      posY += velY;

      if (posX <= 10 || posX >= zoneWidth - 10) velX *= -1;
      if (posY <= 10 || posY >= zoneHeight - 10) velY *= -1;

      noBtn.style.left = `${posX}px`;
      noBtn.style.top = `${posY}px`;
    }

    let continuousMotion = setInterval(moveNoBtnConstantly, 20);

    function escapeMouse(e) {
      const rect = btnZone.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const mouseX = clientX - rect.left;
      const mouseY = clientY - rect.top;

      const zoneWidth = btnZone.clientWidth - noBtn.clientWidth;
      const zoneHeight = btnZone.clientHeight - noBtn.clientHeight;

      posX = mouseX > zoneWidth / 2 ? Math.random() * (zoneWidth / 3) : (zoneWidth / 2) + Math.random() * (zoneWidth / 3);
      posY = mouseY > zoneHeight / 2 ? Math.random() * (zoneHeight / 3) : (zoneHeight / 2) + Math.random() * (zoneHeight / 3);

      noBtn.style.left = `${posX}px`;
      noBtn.style.top = `${posY}px`;
    }

    btnZone.addEventListener('mousemove', (e) => {
      const btnRect = noBtn.getBoundingClientRect();
      const dist = Math.hypot(e.clientX - (btnRect.left + btnRect.width/2), e.clientY - (btnRect.top + btnRect.height/2));
      if (dist < 80) escapeMouse(e);
    });

    noBtn.addEventListener('mouseenter', escapeMouse);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      escapeMouse(e);
    });

    /* 3. SWITCH TO PAGE 2 & CONFETTI */
    function goToPage2() {
      clearInterval(continuousMotion);
      document.getElementById('page1').style.display = 'none';
      document.getElementById('page2').style.display = 'block';

      confetti({
        particleCount: 160,
        spread: 90,
        origin: { y: 0.5 },
        colors: ['#f472b6', '#ec4899', '#ffffff']
      });

      renderLockedPhotos();
    }

    /* 4. PERMANENT IMAGE UPLOADER, LOCK & LIGHTBOX PREVIEW SYSTEM */
    function triggerUpload(index) {
      let lockedPhotos = JSON.parse(localStorage.getItem('swiggy_circle_photos') || '{}');
      if (lockedPhotos[index]) return;
      document.getElementById(`input-${index}`).click();
    }

    function uploadSinglePhoto(event, index) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        let lockedPhotos = JSON.parse(localStorage.getItem('swiggy_circle_photos') || '{}');
        
        lockedPhotos[index] = {
          imgSrc: e.target.result
        };

        localStorage.setItem('swiggy_circle_photos', JSON.stringify(lockedPhotos));
        renderLockedPhotos();
      };

      reader.readAsDataURL(file);
    }

    function renderLockedPhotos() {
      let lockedPhotos = JSON.parse(localStorage.getItem('swiggy_circle_photos') || '{}');

      for (let i = 0; i < 2; i++) {
        const slotEl = document.getElementById(`slot-${i}`);
        if (lockedPhotos[i]) {
          slotEl.innerHTML = `<img src="${lockedPhotos[i].imgSrc}" alt="Memory with Swiggy" onclick="openLightbox('${lockedPhotos[i].imgSrc}')" />`;
          slotEl.style.cursor = "default";
        }
      }
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }
  </script>
</body>
</html>
